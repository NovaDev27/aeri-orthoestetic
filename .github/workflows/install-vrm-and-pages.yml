name: Install Aeri VRM and enable Pages
on:
  workflow_dispatch:
  push:
    paths:
      - "aeri.vrm.b64"
      - "aeri.vrm.b64.*"
      - ".github/workflows/install-vrm-and-pages.yml"
permissions:
  contents: write
  pages: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode VRM and enable GitHub Pages from main root
        env:
          EXPECTED_SHA256: 0f4cb8afcf65f9a5ee5c346a695e11027a311d6db4cf7474d16c828344b60e4c
          EXPECTED_SIZE: "3595312"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ls aeri.vrm.b64.* >/dev/null 2>&1; then
            cat aeri.vrm.b64.* | base64 -d > aeri.vrm
          elif [ -f aeri.vrm.b64 ]; then
            base64 -d aeri.vrm.b64 > aeri.vrm
          else
            echo "no base64 source found"
            exit 1
          fi
          size=$(wc -c < aeri.vrm | tr -d ' ')
          sha=$(sha256sum aeri.vrm | awk '{print $1}')
          echo "size=$size sha256=$sha"
          test "$size" = "$EXPECTED_SIZE"
          test "$sha" = "$EXPECTED_SHA256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aeri.vrm
          if git diff --cached --quiet; then
            echo "aeri.vrm already up to date"
          else
            git commit -m "Avatar 3D da Aeri (versão leve para o site)"
            git push
          fi
          # Enable GitHub Pages from main branch root. Ignore if already enabled.
          gh api -X POST /repos/${{ github.repository }}/pages \
            -f "source[branch]=main" -f "source[path]=/" \
            --header "Accept: application/vnd.github+json" \
            || gh api -X PUT /repos/${{ github.repository }}/pages \
            -f "source[branch]=main" -f "source[path]=/" \
            --header "Accept: application/vnd.github+json" \
            || echo "Pages API call failed (will report)"
