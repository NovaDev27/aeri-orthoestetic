name: Cleanup temp publish files
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cleanup-temp.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary publish files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f aeri.vrm.b64.* || true
          git rm -f README.md || true
          git rm -f .github/workflows/install-vrm-and-pages.yml || true
          git rm -f .github/workflows/pages.yml || true
          git rm -f .github/workflows/cleanup-temp.yml || true
          if git diff --cached --quiet; then
            echo "nothing to clean"
            exit 0
          fi
          git commit -m "Remove arquivos temporários da publicação"
          git push
